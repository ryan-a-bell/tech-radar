DeepSeek-Reasonix","name":"DeepSeek-Reasonix","description":"DeepSeek-native AI coding agent for your terminal. Engineered around prefix-cache stability — leave it running.","quadrant":"Languages","ring":"Discovered","url":"https://github.com/esengine/DeepSeek-Reasonix","company":null,"topics":[]},{"id":"github:huggingface/speech-to-speech","name":"speech-to-speech","description":"Build local voice agents with open-source models","quadrant":"Languages","ring":"Discovered","url":"https://github.com/huggingface/speech-to-speech","company":"Hugging Face","topics":[]},{"id":"github:paperswithbacktest/awesome-systematic-trading","name":"awesome-systematic-trading","description":"A curated list of awesome libraries, packages, strategies, books, blogs, tutorials for systematic trading.","quadrant":"Languages","ring":"Discovered","url":"https://github.com/paperswithbacktest/awesome-systematic-trading","company":null,"topics":[]},{"id":"github:microsoft/agent-governance-toolkit","name":"agent-governance-toolkit","description":"AI Agent Governance Toolkit — Policy enforcement, zero-trust identity, execution sandboxing, and reliability engineering for autonomous AI agents. Covers 10/10 OWASP Agentic Top 10.","quadrant":"Languages","ring":"Discovered","url":"https://github.com/microsoft/agent-governance-toolkit","company":"Microsoft","topics":[]},{"id":"github:apache/cassandra","name":"cassandra","description":"Open source transactional distributed database. Linear scalability and proven fault-tolerance on commodity hardware or cloud infrastructure without compromising performance.","quadrant":"Tools","ring":"Discovered","url":"https://github.com/apache/cassandra","company":null,"topics":[]},{"id":"github:opengeos/GeoLibre","name":"GeoLibre","description":"A lightweight, cloud-native GIS platform for visualizing, exploring, and analyzing geospatial data. It runs in the web browser, on the desktop, on mobile, and inside Jupyter notebooks.","quadrant":"Languages","ring":"Discovered","url":"https://github.com/opengeos/GeoLibre","company":null,"topics":[]},{"id":"github:Lordog/dive-into-llms","name":"dive-into-llms","description":"《动手学大模型Dive into LLMs》系列编程实践教程","quadrant":"Tools","ring":"Discovered","url":"https://github.com/Lordog/dive-into-llms","company":null,"topics":[]},{"id":"github:OtterMind/Chat2DB","name":"Chat2DB","description":"🔥🔥🔥 AI-driven database tool and SQL client, The hottest GUI client, supporting MySQL, Oracle, PostgreSQL, DB2, SQL Server, DB2, SQLite, H2, ClickHouse, and more.","quadrant":"Tools","ring":"Discovered","url":"https://github.com/OtterMind/Chat2DB","company":null,"topics":[]},{"id":"github:alibaba/open-code-review","name":"open-code-review","description":"Open-source & free — Battle-tested at Alibaba's scale. Hybrid architecture code review tool: deterministic pipelines + LLM Agent, precise line-level comments, built-in fine-tuned ruleset (NPE, thread-safety, XSS, SQL injection), OpenAI & Anthropic compatible.","quadrant":"Languages","ring":"Discovered","url":"https://github.com/alibaba/open-code-review","company":null,"topics":[]},{"id":"github:jellyfin/jellyfin","name":"jellyfin","description":"The Free Software Media System - Server Backend & API","quadrant":"Tools","ring":"Discovered","url":"https://github.com/jellyfin/jellyfin","company":null,"topics":[]},{"id":"github:citrolabs/ego-lite","name":"ego-lite","description":"The best browser for both you and your AI agents work in parallel.","quadrant":"Tools","ring":"Discovered","url":"https://github.com/citrolabs/ego-lite","company":null,"topics":[]}],"projects":[{"id":"autonomous-trading-desk","name":"Autonomous Trading Desk","status":"Idea","topics":["Trading","Quant","Agents","Data Feeds"],"blurb":"A multi-agent trading desk — a hedge fund in a box. Research agents surface theses from the news and price action, a quant agent prices and backtests them, a risk agent vetoes anything that breaches position or drawdown limits, and an execution agent works the resulting orders — all supervised by a human and every decision logged for the post-mortem.","stack":["TradingAgents","gs-quant","Riskfolio-Lib","Polygon.io","IBKR TWS","Ollama","grafana"]},{"id":"document-intelligence-engine","name":"Technical-Document Intelligence Engine","status":"Idea","topics":["OCR","RAG","AI","Agents"],"blurb":"An engine that turns a wall of scanned specifications, drawings, and PDFs into a queryable knowledge base. It runs OCR over the scans, recovers document structure and tables, and builds a knowledge graph you can ask engineering questions against — with every answer citing the exact source document and page it came from.","stack":["PaddleOCR","docling","MinerU","cognee","Ollama"]},{"id":"gsd-core-app","name":"GSD Core App","status":"Active","topics":["Quant","Agents"],"blurb":"A local-first \"get stuff done\" runner that turns a plain-language goal into a sequence of executed steps. It plans a task graph, routes each step to a local model, and keeps the whole loop on the machine so nothing leaves the laptop.","stack":["gsd-core","Cursor","Ollama"]},{"id":"microgrid-dispatch-optimizer","name":"Microgrid Dispatch & Resilience Optimizer","status":"Idea","topics":["ML","Agents","Data Feeds"],"blurb":"A dispatch optimizer for a campus microgrid — solar, battery storage, a diesel backup, and a mix of controllable loads. It forecasts demand and generation for the day ahead, then schedules storage and generation to ride through grid outages at least cost, re-planning as the weather and the load actually unfold.","stack":["Modelica","ModelCenter","mesa","vLLM","grafana"]},{"id":"options-vol-surface","name":"Options Vol-Surface Lab","status":"Idea","topics":["Quant","Trading","Data Feeds"],"blurb":"An idea, no code yet. I want to build and calibrate an implied-volatility surface for equity options: pull an options chain, fit a no-arbitrage surface across strikes and expiries, and price exotic payoffs off it. The interesting part is the calibration — SVI or SABR fits, arbitrage checks, and a clean way to interpolate the surface for pricing.","stack":[]},{"id":"radar-portfolio-optimizer","name":"Portfolio Optimizer","status":"Paused","topics":["Quant","Trading","ML"],"blurb":"A backtesting harness for portfolio construction. It takes a universe of tickers and a set of constraints, then compares allocation methods — mean variance, hierarchical risk parity, and a few risk-budgeting schemes — on the same out-of-sample window so the tradeoffs are visible side by side.","stack":["Riskfolio-Lib","gs-quant"]},{"id":"sar-contested-comms-mesh","name":"Contested-Comms SAR Mesh","status":"Idea","topics":["Agents","ML","Data Feeds"],"blurb":"The same rescue fleet, but assuming the radios drop. This project layers a resilient communications mesh over the SAR fleet so vessels and drones keep sharing a common operating picture when the link to shore is jammed, over the horizon, or saturated. Craft relay for each other, buffer telemetry through outages, and fall back to intermittent satellite passes — and the task allocator has to keep…","stack":["ANSYS HFSS / AEDT","CST Studio Suite","STK","iroh","PettingZoo","UAF","OpenObserve"]},{"id":"sar-fleet-coordinator","name":"SAR Fleet Coordinator","status":"Active","topics":["AI","ML","Agents","Data Feeds"],"blurb":"Coordination software for search-and-rescue missions flown by a mixed fleet of unmanned surface vessels and UAVs. An incident commander drops a last-known position and a drift model; the planner divides the search area into cells, assigns each craft a sweep pattern sized to its sensor footprint and endurance, and re-tasks the fleet live as the probability-of-detection map updates from every pass.","stack":["STK","SysML v2","PettingZoo","Ollama","grafana","Docker"]},{"id":"sensor-anomalies","name":"Sensor Telemetry Anomalies","status":"Idea","topics":["ML","Data Feeds"],"blurb":"An idea for detecting anomalies in industrial sensor streams over time. The plan: ingest telemetry from many sensors, resample the irregular timestamps onto a regular grid, decompose trend and seasonality, and fit a rolling forecast so points that break the predicted band get flagged.","stack":[]},{"id":"trading-timeseries","name":"Trading Time-Series Forecaster","status":"Active","topics":["Quant","Trading","ML"],"blurb":"Walk-forward forecasting of equity price series. It builds lagged features and rolling-window statistics from the raw series, trains a model per volatility regime, and validates strictly out-of-sample so nothing leaks from the future.","stack":["gs-quant","QuantPy"]}],"people":[{"id":"devin-cross","name":"Devin Cross","role":"Platform Engineer","topics":["Data Feeds"],"interests":["ML"],"blurb":"Keeps the data platform standing — the pipelines, schedulers, and clusters everything else runs on. Orchestrates batch and streaming jobs, models the warehouse so analysts trust the numbers, and instruments the whole thing so a broken feed pages a human before it corrupts a downstream table.","skills":["Kubernetes","Docker","grafana","prefect","dbt-core","terraform","go","observability","CI/CD"]},{"id":"maya-okafor","name":"Maya Okafor","role":"ML Engineer","topics":["ML","AI","RAG"],"interests":["Agents"],"blurb":"Serves and adapts large language models for production — quantising checkpoints to fit the hardware, standing up high-throughput inference, and wiring retrieval so answers stay grounded in a private corpus. Spends a lot of time on the unglamorous middle: chunking, embedding, evaluating whether a retrieval change actually helped, and keeping latency inside budget.","skills":["pytorch","vLLM","llama.cpp","Ollama","Python","embeddings","fine-tuning","retrieval"]},{"id":"priya-nair","name":"Priya Nair","role":"AI Agents Engineer","topics":["Agents","AI","Prompts"],"interests":["Quant","RAG"],"blurb":"Builds multi-agent systems — teams of models that divide a task, argue, and get reconciled by a supervisor. Designs the tool interfaces the const { useState, useMemo, useEffect, useRef } = React;

/* ============================================================================
 * DISCOVER — "paste a description, find what's most similar"
 *
 * Paste a paragraph describing what you're building; the page vectorises it
 * into the same TF-IDF space as four corpora and surfaces the strongest match
 * in each — Technology · Similar projects · People · Learning materials.
 *
 * One page, two ways to read the result — flip with the view toggle:
 *   COLUMNS  four columns, the highest match per column as a hero card.
 *   RADAR    a scope: your idea at the centre, matches as blips (sector =
 *            category, distance from centre = match strength), plus an
 *            auto-assembled "build kit" reading the best pick per category.
 *
 * Ranking runs in-browser in real time on every keystroke: corpus vectors are
 * built once on load, so each input only vectorises the query and cosines it.
 * The method selector is where semantic EMBEDDINGS drop in later — the query
 * would be embedded at runtime (in-browser model or an endpoint) and cosined
 * against precomputed item embeddings, behind the same rankQuery seam.
 * ==========================================================================*/

const CATS = [
  { key: "tools",    label: "Technology",       accent: "#3987e5", noun: "tool",     a0: -Math.PI / 2 }, // top
  { key: "projects", label: "Similar projects", accent: "#199e70", noun: "project",  a0: 0 },            // right
  { key: "people",   label: "People",           accent: "#c98500", noun: "person",   a0: Math.PI / 2 },  // bottom
  { key: "learning", label: "Learning",         accent: "#9085e9", noun: "resource", a0: Math.PI },      // left
];
const ACCENT = Object.fromEntries(CATS.map((c) => [c.key, c.accent]));
const LABEL = Object.fromEntries(CATS.map((c) => [c.key, c.label]));

const EXAMPLE = "I want to build a system that watches market news and price action, where one agent forms trade theses, another prices and backtests them, a risk agent enforces drawdown and position limits, and an execution agent places the orders — all supervised by a human, with every decision logged for a post-mortem.";

// ---------------------------------------------------------------------------
// text prep — mirrors similarity.html / projects.html so results stay consistent
// ---------------------------------------------------------------------------
const STOP = new Set(("a an the and or of for to in on with without from by is are be " +
  "this that it its as at into your you our their they we can will use used using " +
  "via based over under across between not no more most other any all which who whom " +
  "open source library tool toolkit app application project framework platform so " +
  "github repo repository code want build yet i").split(/\s+/));
function tokenize(s) {
  return (s || "").toLowerCase().replace(/[^a-z0-9+#.\- ]+/g, " ").split(/[\s.]+/)
    .map((t) => t.replace(/^[-+#]+|[-+#]+$/g, ""))
    .filter((t) => t.length >= 2 && !STOP.has(t) && !/^\d+$/.test(t));
}
const toolText     = (t) => [t.description, t.name, t.company || "", (t.topics || []).join(" ")].join(" ");
const projectText  = (p) => [p.name, p.blurb, (p.topics || []).join(" "), (p.stack || []).join(" ")].join(" ");
const personText   = (p) => [p.name, p.role, p.blurb, (p.topics || []).join(" "), (p.interests || []).join(" "), (p.skills || []).join(" ")].join(" ");
const learningText = (l) => [l.title, l.author || "", l.blurb, (l.topics || []).join(" ")].join(" ");
const TEXT = { tools: toolText, projects: projectText, people: personText, learning: learningText };

/* One shared TF-IDF space over ALL four corpora, so a query vector and any item
 * vector are directly comparable. Precomputes an L2-normalised vector per item. */
function buildEngine(data) {
  const cats = CATS.map((c) => ({ ...c, items: data[c.key] || [] }));
  const allTokens = [];
  for (const c of cats) for (const it of c.items) allTokens.push(tokenize(TEXT[c.key](it)));
  const n = allTokens.length || 1;
  const df = new Map();
  for (const toks of allTokens) for (const t of new Set(toks)) df.set(t, (df.get(t) || 0) + 1);
  const idf = (t) => Math.log((1 + n) / (1 + (df.get(t) || 0))) + 1;
  const vecFromTokens = (toks) => {
    const counts = new Map();
    for (const t of toks) counts.set(t, (counts.get(t) || 0) + 1);
    const v = new Map();
    let norm = 0;
    for (const [t, c] of counts) { const w = (1 + Math.log(c)) * idf(t); v.set(t, w); norm += w * w; }
    norm = Math.sqrt(norm) || 1;
    for (const [t, w] of v) v.set(t, w / norm);
    return v;
  };
  let k = 0;
  for (const c of cats) for (const it of c.items) it._vec = vecFromTokens(allTokens[k++]);
  return { cats, vecFromTokens };
}
function cosine(a, b) {
  const [s, l] = a.size < b.size ? [a, b] : [b, a];
  let dot = 0;
  for (const [t, w] of s) { const o = l.get(t); if (o) dot += w * o; }
  return dot;
}
function sharedTerms(a, b, k = 5) {
  const out = [];
  for (const [t, w] of a) { const o = b.get(t); if (o) out.push([t, w * o]); }
  out.sort((x, y) => y[1] - x[1]);
  return out.slice(0, k).map((x) => x[0]);
}

// ---------------------------------------------------------------------------
// data loading — live corpora when served next to data/, else the inline seed
// ---------------------------------------------------------------------------
async function loadData() {
  const seed = JSON.parse(document.getElementById("seed").textContent);
  const tryFetch = async (paths) => {
    for (const p of paths) { try { const r = await fetch(p); if (r.ok) return await r.json(); } catch (e) {} }
    return null;
  };
  try {
    const [radar, proj, ppl, learn] = await Promise.all([
      tryFetch(["data/radar.json", "../data/radar.json"]),
      tryFetch(["data/projects.json", "../data/projects.json"]),
      tryFetch(["data/people.json", "../data/people.json"]),
      tryFetch(["data/learning.json", "../data/learning.json"]),
    ]);
    if (radar && proj && ppl && learn) {
      const tools = (radar.items || radar)
        .filter((x) => x && x.ring !== "Archived" && (x.description || "").trim())
        .map((t) => ({ id: t.id, name: t.name, description: t.description, quadrant: t.quadrant, ring: t.ring, url: t.url, company: t.company, topics: t.topics || [] }));
      const projects = (proj.projects || []).map((p) => ({ id: p.id, name: p.name, status: p.status, topics: p.topics || [], blurb: p.blurb, stack: (p.stack || []).map((s) => s.name) }));
      const people = (ppl.people || []).map((p) => ({ id: p.id, name: p.name, role: p.role, topics: p.topics || [], interests: p.interests || [], blurb: p.blurb, skills: (p.skills || []).map((s) => s.name).concat(p.skills_freeform || []) }));
      const learning = (learn.items || []).map((l) => ({ id: l.id, type: l.type, title: l.title, author: l.author, year: l.year, status: l.status, rating: l.rating, topics: l.topics || [], blurb: l.blurb }));
      return { tools, projects, people, learning, live: true };
    }
  } catch (e) { /* fall through to seed */ }
  return { ...seed, live: false };
}

// small shared field accessors
const nameOf = (key, it) => (key === "learning" ? it.title : it.name);
function metaSub(key, it) {
  if (key === "tools") return [it.quadrant, it.ring, it.company].filter(Boolean).join(" · ");
  if (key === "projects") return [it.status, (it.topics || []).join(", ")].filter(Boolean).join(" · ");
  if (key === "people") return [it.role, (it.interests || []).join(", ")].filter(Boolean).join(" · ");
  if (key === "learning") return [it.type, it.author, it.status].filter(Boolean).join(" · ") + (it.rating ? " · " + "★".repeat(it.rating) : "");
  return "";
}
const blurbOf = (key, it) => (key === "tools" ? it.description : it.blurb) || "";
function topicsOf(key, it) {
  if (key === "people") return [...(it.topics || []), ...(it.interests || [])].slice(0, 4);
  return (it.topics || []).slice(0, 4);
}
const clip = (s, n) => (s || "").length > n ? s.slice(0, n).replace(/\s+\S*$/, "") + "…" : (s || "");

// ============================================================================
function App() {
  const [data, setData] = useState(null);
  const [query, setQuery] = useState(EXAMPLE);
  const [view, setView] = useState("columns");   // "columns" | "radar"
  const [method, setMethod] = useState("tfidf");  // "tfidf"  (embeddings: next)
  const [perCat, setPerCat] = useState(5);        // radar: blips per sector
  const [sel, setSel] = useState(null);           // radar: selected blip id

  useEffect(() => { loadData().then(setData); }, []);
  const engine = useMemo(() => (data ? buildEngine(data) : null), [data]);

  // rank every corpus against the query — recomputed live on each keystroke
  const ranked = useMemo(() => {
    if (!engine) return null;
    const qv = engine.vecFromTokens(tokenize(query));
    const hasQuery = qv.size > 0;
    const byCat = {};
    let globalMax = 0;
    for (const c of engine.cats) {
      const scored = c.items
        .map((it) => ({ key: c.key, item: it, id: c.key + ":" + (it.id || nameOf(c.key, it)),
          score: hasQuery ? cosine(qv, it._vec) : 0, why: hasQuery ? sharedTerms(qv, it._vec) : [] }))
        .filter((x) => x.score > 0.001)
        .sort((a, b) => b.score - a.score);
      byCat[c.key] = scored;
      if (scored.length) globalMax = Math.max(globalMax, scored[0].score);
    }
    globalMax = globalMax || 1;
    const top = CATS.map((c) => (byCat[c.key][0] ? { ...byCat[c.key][0], rel: byCat[c.key][0].score / globalMax } : null));
    return { byCat, top, globalMax, hasQuery };
  }, [engine, query]);

  // radar-only derivation: top-N per sector with normalised relevance
  const blips = useMemo(() => {
    if (!ranked) return [];
    const out = [];
    for (const c of CATS) {
      const list = (ranked.byCat[c.key] || []).slice(0, perCat);
      list.forEach((r, i) => out.push({ ...r, rel: r.score / ranked.globalMax, rank: i, sectorCount: list.length }));
    }
    return out;
  }, [ranked, perCat]);

  if (!data || !engine || !ranked) return <div className="loading">building the index…</div>;

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100vh" }}>
      <TopBar live={data.live} total={engine.cats.reduce((a, c) => a + c.items.length, 0)} view={view} />
      <QueryBox query={query} setQuery={setQuery} onExample={() => setQuery(EXAMPLE)} onClear={() => setQuery("")} />
      <ControlBar view={view} setView={setView} method={method} setMethod={setMethod}
        perCat={perCat} setPerCat={setPerCat} />
      <div style={{ flex: 1, minHeight: 0, overflow: view === "columns" ? "auto" : "hidden" }}>
        {!ranked.hasQuery
          ? <Empty />
          : view === "columns"
            ? <ColumnsView engine={engine} ranked={ranked} />
            : <RadarView blips={blips} top={ranked.top} sel={sel} setSel={setSel} />}
      </div>
      <Footer live={data.live} view={view} />
    </div>
  );
}

/* ==========================================================================

function ColumnsView({ engine, ranked }) {

      {engine.cats.map((c, i) => (

          border={i < engine.cats.length - 1} />
      ))}
    </div>
  );
}
function pct(score, globalMax) { return Math.max(2, Math.round((score / globalMax) * 100)); }
function itemKey(cat, it) { return it.id || nameOf(cat.key, it); }

function Column({ cat, results, globalMax, border }) {
  const top = results[0];
  const rest = results.slice(1, 4);
  return (
    <div style={{ padding: "14px 16px 26px", borderRight: border ? "1px solid var(--border)" : "none" }}>

      </div>

        <>
          <HeroCard cat={cat} r={top} globalMax={globalMax} />
          {rest.length > 0 && (
            <div style={{ marginTop: 16 }}>
              <div style={{ color: "var(--muted)", fontSize: 10, letterSpacing: 1, textTransform: "uppercase", marginBottom: 6 }}>also close</div>
              {rest.map((r) => <RunnerRow key={itemKey(cat, r.item)} cat={cat} r={r} globalMax={globalMax} />)}
            </div>
          )}
        </>
      ) : <div style={{ color: "var(--muted)", fontSize: 12, marginTop: 20 }}>No strong match in this corpus for the description.</div>}
    </div>
  );
}

function HeroCard({ cat, r, globalMax }) {
  const { item, why } = r;
  const p = pct(r.score, globalMax);
  return (
    <div style={{ border: "1px solid var(--border)", borderRadius: 12, padding: 14,

      {why.length > 0 && <div style={{ color: "var(--muted)", fontSize: 11, marginTop: 9 }}>why: <span style={{ color: cat.accent }}>{why.join(" · ")}</span></div>}

}
function RunnerRow({ cat, r, globalMax }) {
  const { item } = r;
  const p = pct(r.score, globalMax);
  return (
    <div style={{ padding: "8px 0", borderTop: "1px solid var(--border)" }}>

    </div>

}
function Ring({ pct, accent }) {
  const R = 22, C = 2 * Math.PI * R;
  return (
    <div style={{ position: "relative", width: 58, height: 58, flex: "0 0 auto" }}>
      <svg width="58" height="58" viewBox="0 0 58 58">

        <circle cx="29" cy="29" r={R} fill="none" stroke={accent} strokeWidth="5" strokeLinecap="round"
          strokeDasharray={C} strokeDashoffset={C * (1 - pct / 100)} transform="rotate(-90 29 29)" />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 13, fontWeight: 600, fontVariantNumeric: "tabular-nums" }}>{pct}%</div>

function Chips({ topics }) {
  if (!topics.length) return null;
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 9 }}>
      {topics.map((t) => (

function LinkRow({ cat, item }) {
  if (cat.key === "tools" && item.url)
    return <div style={{ marginTop: 10 }}><a href={item.url} target="_blank" style={{ fontSize: 11.5 }}>{item.url.replace(/^https?:\/\//, "")}</a></div>;
  if (cat.key === "people")
    return <div style={{ marginTop: 10, fontSize: 11.5, color: "var(--muted)" }}>skills: {(item.skills || []).slice(0, 4).join(", ") || "—"}</div>;
  if (cat.key === "projects")
    return <div style={{ marginTop: 10, fontSize: 11.5, color: "var(--muted)" }}>stack: {(item.stack || []).slice(0, 4).join(", ") || "not declared"}</div>;

/* ==========================================================================
 * RADAR view (scope + build kit)
 * ========================================================================== */
function RadarView({ blips, top, sel, setSel }) {
  const selBlip = sel ? blips.find((b) => b.id === sel) : null;
  return (
    <div style={{ height: "100%", display: "flex" }}>
      <div style={{ flex: 1, minWidth: 0, position: "relative" }}>
        <Scope blips={blips} sel={sel} setSel={setSel} selBlip={selBlip} />
      </div>
      <BuildKit top={top} sel={sel} setSel={setSel} />
    </div>
  );
}

function Scope({ blips, sel, setSel, selBlip }) {
  const canvasRef = useRef(null);
  const layoutRef = useRef({ blips: [], cx: 0, cy: 0, r: 0 });
  const [hover, setHover] = useState(null);

  const placed = useMemo(() => blips.map((b) => {
    const cat = CATS.find((c) => c.key === b.key);
    const span = Math.PI / 2 * 0.74;
    const t = b.sectorCount > 1 ? b.rank / (b.sectorCount - 1) : 0.5;
    const angle = cat.a0 + (t - 0.5) * span;
    const radiusFrac = 0.16 + (1 - b.rel) * 0.72;
    return { ...b, angle, radiusFrac, accent: cat.accent };
  }), [blips]);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    let raf, running = true, sweep = 0;
    const resize = () => {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + "px"; canvas.style.height = rect.height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    window.addEventListener("resize", resize);

    const draw = () => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const cx = w / 2, cy = h / 2;
      const r = Math.min(w, h) / 2 - 46;
      ctx.clearRect(0, 0, w, h);

      ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.lineWidth = 1;
      for (let k = 1; k <= 4; k++) { ctx.beginPath(); ctx.arc(cx, cy, r * k / 4, 0, Math.PI * 2); ctx.stroke(); }
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      for (const ang of [Math.PI / 4, 3 * Math.PI / 4, 5 * Math.PI / 4, 7 * Math.PI / 4]) {
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r); ctx.stroke();
      }
      ctx.font = "600 11px 'IBM Plex Mono', monospace"; ctx.textAlign = "center";
      for (const c of CATS) {
        const lx = cx + Math.cos(c.a0) * (r + 26), ly = cy + Math.sin(c.a0) * (r + 26);
        ctx.fillStyle = c.accent; ctx.fillText(c.label.toUpperCase(), lx, ly + 4);
      }

      sweep += 0.012;
      ctx.save();
      ctx.translate(cx, cy);
      const seg = 44;
      for (let i = 0; i < seg; i++) {
        const a1 = sweep - (i / seg) * 0.9;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a1, a1 + 0.05); ctx.closePath();
        ctx.fillStyle = `rgba(120,180,255,${0.05 * (1 - i / seg)})`; ctx.fill();
      }
      ctx.strokeStyle = "rgba(150,200,255,0.35)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(sweep) * r, Math.sin(sweep) * r); ctx.stroke();
      ctx.restore();

      ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#c3c2b7"; ctx.font = "10px 'IBM Plex Mono', monospace"; ctx.textAlign = "center";
      ctx.fillText("YOUR IDEA", cx, cy + 26);

      const laid = [];
      const hiId = hover || sel;
      for (const b of placed) {
        const bx = cx + Math.cos(b.angle) * r * b.radiusFrac;
        const by = cy + Math.sin(b.angle) * r * b.radiusFrac;
        const size = 4 + b.rel * 7;
        laid.push({ ...b, x: bx, y: by, size });
        const isHi = b.id === hiId;
        ctx.strokeStyle = isHi ? b.accent : "rgba(140,150,165,0.14)"; ctx.lineWidth = isHi ? 1.6 : 0.8;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by); ctx.stroke();
        if (b.rank === 0) { ctx.beginPath(); ctx.arc(bx, by, size + 5, 0, Math.PI * 2); ctx.fillStyle = b.accent + "22"; ctx.fill(); }
        ctx.beginPath(); ctx.arc(bx, by, size, 0, Math.PI * 2);
        ctx.fillStyle = b.accent; ctx.globalAlpha = isHi ? 1 : 0.9; ctx.fill(); ctx.globalAlpha = 1;
        if (isHi) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke(); }
        if (b.rank === 0 || isHi) {
          ctx.fillStyle = "#e8e8e2"; ctx.textAlign = "left";
          ctx.font = (isHi ? "600 " : "") + "10px 'IBM Plex Mono', monospace";
          const nm = nameOf(b.key, b.item);
          ctx.fillText(nm.length > 22 ? nm.slice(0, 21) + "…" : nm, bx + size + 5, by + 3);
        }
      }
      layoutRef.current = { blips: laid, cx, cy, r };
      if (running) raf = requestAnimationFrame(draw);
    };
    draw();
    return () => { running = false; cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
  }, [placed, hover, sel]);

  const pick = (ev) => {
    const canvas = canvasRef.current, rect = canvas.getBoundingClientRect();
    const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
    let best = null, bd = 16 * 16;
    for (const b of layoutRef.current.blips) {
      const d = (b.x - x) ** 2 + (b.y - y) ** 2;
      if (d < bd + b.size * b.size) { bd = d; best = b; }
    }
    return best;
  };

  const hoverBlip = hover && layoutRef.current.blips.find((b) => b.id === hover);
  return (
    <div style={{ position: "absolute", inset: 0 }}>
      <canvas ref={canvasRef}
        onMouseMove={(e) => { const b = pick(e); setHover(b ? b.id : null); e.currentTarget.style.cursor = b ? "pointer" : "default"; }}
        onMouseLeave={() => setHover(null)}
        onClick={(e) => { const b = pick(e); setSel(b ? b.id : null); }}
        style={{ display: "block", width: "100%", height: "100%" }} />
      {(selBlip || hoverBlip) && <BlipCard b={selBlip || hoverBlip} pinned={!!selBlip} onClose={() => setSel(null)} />}
    </div>
  );
}

function BlipCard({ b, pinned, onClose }) {
  return (
    <div style={{ position: "absolute", left: 14, bottom: 14, maxWidth: 380,
      background: "rgba(20,20,19,0.96)", border: "1px solid var(--border)", borderRadius: 10, padding: "11px 13px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <span style={{ width: 10, height: 10, borderRadius: 2, background: b.accent }} />
        <span style={{ fontSize: 10, letterSpacing: 1, color: b.accent, textTransform: "uppercase" }}>{LABEL[b.key]}</span>
        <strong style={{ fontSize: 14 }}>{nameOf(b.key, b.item)}</strong>
        <span style={{ marginLeft: "auto", color: "var(--ink-2)", fontVariantNumeric: "tabular-nums", fontSize: 12 }}>{Math.round(b.rel * 100)}%</span>
        {pinned && <button onClick={onClose} style={{ background: "none", border: "none", color: "var(--muted)", cursor: "pointer", fontSize: 16, marginLeft: 4 }}>×</button>}
      </div>
      <div style={{ color: "var(--muted)", fontSize: 11.5, marginTop: 2 }}>{metaSub(b.key, b.item)}</div>
      <div style={{ color: "var(--ink-2)", fontSize: 12, marginTop: 7 }}>{clip(blurbOf(b.key, b.item), 200)}</div>
      {b.why && b.why.length > 0 && <div style={{ color: "var(--muted)", fontSize: 11, marginTop: 7 }}>why: <span style={{ color: b.accent }}>{b.why.join(" · ")}</span></div>}
      {b.key === "tools" && b.item.url && <div style={{ marginTop: 7 }}><a href={b.item.url} target="_blank" style={{ fontSize: 11.5 }}>{b.item.url.replace(/^https?:\/\//, "")}</a></div>}
    </div>
  );
}

function BuildKit({ top, sel, setSel }) {
  return (
    <div style={{ width: 320, flex: "0 0 320px", borderLeft: "1px solid var(--border)", overflow: "auto",
      padding: "16px 16px 24px", background: "var(--surface-1)" }}>
      <div style={{ fontSize: 12, letterSpacing: 1, textTransform: "uppercase", marginBottom: 4 }}>Your build kit</div>
      <div style={{ color: "var(--muted)", fontSize: 11.5, marginBottom: 14 }}>the single strongest match in each category, assembled into one recommendation</div>
      {top.map((r, i) => {
        const cat = CATS[i];
        if (!r) return (
          <div key={cat.key} style={{ padding: "12px 0", borderTop: "1px solid var(--border)" }}>
            <SectionLead accent={cat.accent} label={cat.label} />
            <div style={{ color: "var(--muted)", fontSize: 12, marginTop: 6 }}>no strong match</div>
          </div>
        );
        const id = cat.key + ":" + (r.item.id || nameOf(cat.key, r.item));
        const on = sel === id;
        return (
          <div key={cat.key} onClick={() => setSel(on ? null : id)}
            style={{ padding: "12px 0", borderTop: "1px solid var(--border)", cursor: "pointer",
              background: on ? "rgba(255,255,255,0.03)" : "transparent" }}>
            <SectionLead accent={cat.accent} label={cat.label} pct={Math.round(r.rel * 100)} />
            <div style={{ fontSize: 14, fontWeight: 600, marginTop: 6 }}>{nameOf(cat.key, r.item)}</div>
            <div style={{ color: "var(--muted)", fontSize: 11.5, marginTop: 2 }}>{metaSub(cat.key, r.item)}</div>
            <div style={{ color: "var(--ink-2)", fontSize: 12, marginTop: 6 }}>{clip(blurbOf(cat.key, r.item), 150)}</div>
            {cat.key === "tools" && r.item.url &&
              <div style={{ marginTop: 6 }}><a href={r.item.url} target="_blank" onClick={(e) => e.stopPropagation()} style={{ fontSize: 11.5 }}>{r.item.url.replace(/^https?:\/\//, "")}</a></div>}
          </div>
        );
      })}
      <div style={{ marginTop: 16, padding: "12px 13px", border: "1px dashed var(--border)", borderRadius: 10, color: "var(--ink-2)", fontSize: 12 }}>
        <span style={{ color: "var(--muted)" }}>Reads as:</span> build it with <KitPhrase top={top} />.
      </div>
    </div>
  );
}
function SectionLead({ accent, label, pct }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <span style={{ width: 9, height: 9, borderRadius: 2, background: accent }} />
      <span style={{ fontSize: 10.5, letterSpacing: 1, textTransform: "uppercase", color: "var(--muted)" }}>{label}</span>
      {pct != null && <span style={{ marginLeft: "auto", fontSize: 11, color: accent, fontVariantNumeric: "tabular-nums" }}>{pct}%</span>}
    </div>
  );
}
function KitPhrase({ top }) {
  const [t, p, pe, l] = top;
  const parts = [];
  if (t) parts.push(<b key="t" style={{ color: ACCENT.tools }}>{t.item.name}</b>);
  if (pe) parts.push(<span key="pe">, talk to <b style={{ color: ACCENT.people }}>{pe.item.name}</b></span>);
  if (p) parts.push(<span key="p">, study <b style={{ color: ACCENT.projects }}>{p.item.name}</b></span>);
  if (l) parts.push(<span key="l">, and read <b style={{ color: ACCENT.learning }}>{l.item.title}</b></span>);
  return <span>{parts}</span>;
}

function Footer({ live, view }) {
  return (
    <div style={{ display: "flex", gap: 16, alignItems: "center", padding: "9px 16px",
      borderTop: "1px solid var(--border)", background: "var(--surface-1)", color: "var(--muted)", fontSize: 11.5, flexWrap: "wrap" }}>
      {CATS.map((c) => (
        <span key={c.key} style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ width: 9, height: 9, borderRadius: 2, background: c.accent }} />{c.label}
        </span>
      ))}
      <span style={{ marginLeft: "auto" }}>{view} view · {live ? "live data" : "60-tool sample"} · prototype</span>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
